[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "california-housing-ml"
version = "1.0.0"
description = "End-to-end regression, classification, and clustering portfolio project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "joblib>=1.3,<2"
]

[project.scripts]
housing-ml = "housing_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
